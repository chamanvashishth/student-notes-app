<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Notes App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <h1>Smart Study Dashboard</h1>
      <button id="themeToggle" class="theme-toggle" type="button">🌓 Theme</button>
    </header>

    <section class="dashboard" id="dashboard"></section>

    <main class="layout">
      <section class="panel composer">
        <h2>Add Note</h2>
        <input id="noteTitle" placeholder="Title" />
        <textarea id="noteInput" placeholder="Write your note..."></textarea>
        <div class="row">
          <input id="noteSubject" placeholder="Subject (Math, Science...)" />
          <input id="noteTags" placeholder="Tags comma separated" />
        </div>
        <button id="addNoteBtn" type="button">Add Note</button>
      </section>

      <section class="panel notes-panel">
        <h2>Notes</h2>
        <div class="row">
          <input id="searchInput" placeholder="Search notes..." />
          <select id="filterSubject"><option value="">All subjects</option></select>
        </div>
        <div id="notesContainer" class="notes-list"></div>
      </section>
    </main>

    <section class="panel">
      <h2>Recent Activity Timeline</h2>
      <div id="timeline" class="timeline"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
